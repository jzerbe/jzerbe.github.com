<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title == "Home" %}{{ site.title }} &middot; {{ site.tagline }}{% else %}{{ page.title }} &middot; {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/public/css/geologic.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Public+Sans:wght@700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="{{ "/public/favicon.svg" | relative_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/atom+xml" title="RSS" href="{{ "/atom.xml" | absolute_url }}">

</head>
